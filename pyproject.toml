[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llmjudgecal"
version = "0.0.1"
description = "A calibration and reliability audit toolkit for LLM-as-judge pipelines."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "Garvil007" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.0",
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "statsmodels>=0.14",
    "typer>=0.12",
    "httpx>=0.27",
    "tenacity>=8.2",
]

[project.optional-dependencies]
tracking = ["mlflow>=2.14"]
serve = ["fastapi>=0.111", "uvicorn>=0.30"]
dashboard = ["streamlit>=1.35"]
dev = [
    "ruff>=0.5",
    "mypy>=1.10",
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "hypothesis>=6.100",
    "pre-commit>=3.7",
]

[project.scripts]
judgecal = "llmjudgecal.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/llmjudgecal"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["llmjudgecal"]
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests that require network/external services",
]
addopts = "-m 'not slow and not integration'"
asyncio_mode = "auto"
